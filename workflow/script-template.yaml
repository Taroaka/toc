# 新規p420: cinematic_direction.json の asset_requests を source_asset_requests_v1 で解決する。
# 未登録素材は原作引用と使用cutを持ち、script/manifest の asset_resolutions と p500 の asset bibleへ渡す。
# source_first_v2: see docs/implementation/visual-planning.md.
# Legacy scene_value_amplification / expressive_contract samples below apply only to v1.
# v2 uses metadata visual_planning_contract and source_visual_value {path, sha256},
# plus source_story_scene_id and scene_intent.visual_notes (empty allowed).
# Script output template
# Canonical order: authoring → structural validation → manifest materialization.
script_metadata:
  topic: "string"
  # Existing-story runs uncomment this marker and project the value lineage one way.
  # adaptation_value_contract: "required_v1"
  scene_time_of_day_contract: "required_v1"
  scene_time_of_day_visual_basis_contract: "required_v1"
  time: "string"
  source_story: "output/<topic>_<timestamp>/story.md"
  source_visual_value: "output/<topic>_<timestamp>/visual_value.md"
  created_at: "ISO8601"
  target_duration_seconds: 300
  duration_plan:
    target_seconds: 300
    minimum_scene_count: 1
    minimum_narration_seconds: 0
    minimum_effective_seconds: 0
  aspect_ratio: "16:9"
  affect_design_reference: "docs/affect-design.md"
  narration_source_of_truth: "script.md"
  visual_intent_source_of_truth: "script.md"
  generation_execution_source_of_truth: "video_manifest.md"
  tts_text_usage_boundary: "tts_text is for TTS only"

# p400 authoring contract. It is input for ordinary preflight and does not contain provider prompts.
scene_set_authoring_contract:
  schema_version: "scene_set_authoring_contract_v1"
  generation_id: "scene-authoring-<id>"
  source_bindings:
    story: {path: "story.md", sha256: "sha256:<raw-file-hex>"}
    visual_value: {path: "visual_value.md", sha256: "sha256:<raw-file-hex>"}
  source_refs:
    - source_ref_id: "source-event-01"
      artifact: "story"
      pointer: "/script/scenes/0"
      expected_id: "event_01"
  canonical_events:
    - event_id: "event_01"
      canonical_order_index: 1
      owner_scene_id: 1
      required_beat_ids: ["scene_01_beat_01"]
      source_ref_ids: ["source-event-01"]
  evidence_catalog:
    - evidence_id: "evidence_01"
      owner_scene_id: 1
      element_id: "element_01"
      source_ref_ids: ["source-event-01"]
      visible_form: "具体的な人物・物・行為"
  reveal_ledger:
    - information_id: "info_01"
      initial_state: withheld
      allowed_states: [withheld, revealed, carried, known]
      transitions: []
  handoff_chain:
    - anchor_id: "handoff_01_02"
      owner_scene_id: 1
      consumer_scene_id: 2
      producer_beat_id: "scene_01_beat_01"
      consumer_beat_id: "scene_02_beat_01"
      state_id: "scene_01_end"
  transition_cues: []
  scenes:
    - scene_id: 1
      owned_event_ids: ["event_01"]
      required_beat_specs: []
      role_bindings: []
      reveal_state_before: {}
      allowed_reveal_transition_ids: []
      reveal_state_after: {}
      time_location_transition:
        time_of_day: ""
        location_sequence: []
        transition_cue_ids: []
      incoming_handoff_anchor_id: "story_opening"
      outgoing_handoff_anchor_id: "handoff_01_02"
      causal_proof_contract:
        cause_beat_id: "scene_01_beat_01"
        action_beat_id: "scene_01_beat_01"
        result_state_id: "scene_01_end"
        required_evidence_ids: []
      non_replaceable_elements: []

# Derived by the ordinary authoring preflight; workers do not hand-write a synthetic pass value.
authoring_preflight:
  status: pending|passed|failed
  generation_id: "scene-authoring-<id>"
  contract_digest: "sha256:<hex>"
  source_digest: "sha256:<hex>"
  preflight_digest: "sha256:<hex>"
  checks: []
  blocking_reason_keys: []

audio_story_plan:
  schema_version: "audio_story_plan_v1"
  authoring_status: draft|authored
  audience_promise: ""
  narrator_bible:
    relationship_to_story: witness|companion|historian|limited_observer|omniscient
    knowledge_boundary: []
    emotional_permission: []
    forbidden_attitudes: []
  open_loops: []
  scene_arcs: []
  silence_budget:
    purpose: ""
    protected_moments: []
  continuous_full_draft: ""

narration_spans:
  - span_id: "ns_001"
    source_cut_ids: []
    story_job: first_question|causal_bridge|payoff|reaction|aftertaste
    opened_loop_ids: []
    closed_loop_ids: []
    text: ""
    tts_text: ""
    audio_visual_relation: orientation_overlap|causal_alignment|complement|counterpoint|voice_silence
    prosody:
      pace: ease|steady|press|hold|release
      pause_function: parse|anticipate|absorb|reaction|handoff|none
    tts_generation_group_id: ""

human_change_requests:
  - request_id: "change_001"
    source: user
    created_at: "ISO8601"
    raw_request: ""
    original_selectors: ["scene_01_cut_01"]
    current_selectors: ["scene_01_cut_01"]
    normalized_actions: []
    status: pending|normalized|applied|deferred
    resolution_notes: ""
    applied_manifest_targets: []

characters:
  - character_id: "protagonist"
    name: "string"
    role: "主人公"

style_guide:
  visual_style: "string"
  forbidden: ["text_overlay", "watermark"]

timeline:
  total_duration_seconds: 300

scenes:
