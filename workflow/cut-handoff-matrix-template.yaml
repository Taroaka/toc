# Cut Handoff Matrix Template v3.0

cut_handoff_matrix_version: "3.0"
scene_id: "1"
scene_selector: "scene1"

scene_event:
  schema_version: scene_event_v1
  event_sequence:
    - beat_id: scene1_beat_01
      beat_function: custom
      visible_action: ""
      visible_reaction: ""
      required_visual_evidence: []

scene_obligations:
  dramatic_question: ""
  value_shift_visible_evidence: []
  causal_turn: ""
  story_event_obligations:
    - event_id: ""
      source_events: []
      audience_knowledge_delta: ""
      causal_proof: ""
      visual_evidence: []
      required_roles: []
  reveal_constraints: []
  handoff_to_next_scene: ""

cuts:
  - selector: scene1_cut1
    source_event_contract:
      primary_event_beat_id: scene1_beat_01
      source_event_beat_ids: [scene1_beat_01]
      event_beat_function: custom
      event_time_position: before_trigger
      event_facts_to_preserve: []
      event_facts_not_to_invent: []
    cut_function: custom
    target_beat: ""
    audience_knowledge_delta: ""
    causal_proof: ""
    visual_evidence: []
    required_roles: []
    anti_redundancy_key: ""
    first_frame:
      state: ""
      static_evidence: []
      must_not_show: []
    motion:
      start_state: ""
      end_state: ""
      must_not_add: []
    narration:
      narrative_position: opening|middle|ending
      voice_function: information|emotion|causality|time|viewpoint|world_rule|contrast|meaning|aftertaste|silence
      visual_distance_policy: stay_close|contextual|meaning_first|silent
      narration_should_add: []
      pronunciation_targets: []
      silent_reason: ""
    receives_from_previous:
      visual: ""
      audio: ""
      causal: ""
      character_state: ""
      prop_state: ""
      spatial_state: ""
    delivers_to_next:
      visual: ""
      audio: ""
      causal: ""
      character_state: ""
      prop_state: ""
      spatial_state: ""
    downstream:
      event_context_for_cut:
        derived_from: scene_event.event_sequence + cut_contract.source_event_contract
        editable: false
      p500_asset:
        required_assets: []
        missing_assets: []
      p600_image:
        first_frame_requirements: []
        must_not_show: []
      p700_narration:
        requirements: []
      p800_video:
        motion_requirements: []
        end_state: ""
        must_not_add: []

handoff_validation:
  all_scene_obligations_covered: false
  event_beat_reference_integrity: false
  source_event_preservation: false
  causal_proof_coverage: false
  role_coverage: false
  audience_knowledge_delta_coverage: false
  no_overloaded_cuts: false
  first_frame_imageable: false
  motion_boundary_valid: false
  narration_boundary_valid: false
  continuity_clear: false
  handoff_clear: false
  ready_for_p500: false
  ready_for_p600: false
  ready_for_p700: false
  ready_for_p800: false

