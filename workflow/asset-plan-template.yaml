# Asset plan template
# p500: inventory/plan → request snapshot → generation → ordinary file/provenance checks
asset_plan_metadata:
  topic: "string"
  source_story: "output/<topic>_<timestamp>/story.md"
  source_script: "output/<topic>_<timestamp>/script.md"
  created_at: "ISO8601"
  purpose: "reusable asset design before cut image generation"

assets:
  characters:
    - asset_id: "character_01"
      asset_type: character_reference
      source_script_selectors: ["scene_01_cut_01"]
      story_purpose: "人物の基準参照"
      subject_contract:
        identity_scope: individual|ensemble
        subject_count: 1
        member_ids: []
      appearance_contract:
        social_position: ""
        occupation_or_role: ""
        occasion_or_state: ""
        silhouette: ""
        materials: ""
        condition: ""
        palette: ""
        must_avoid: []
      reuse_contract:
        mode: neutral_anchor|time_variant|state_variant
        time_of_day: ""
        derived_from_asset_id: ""
      visual_spec:
        identity: []
        fixed_details: []
        must_avoid: []
      generation_plan:
        output_dir: assets/characters
        required_views: [front, side, back]
        view_requirements: full-body head-to-toe
        execution_lane: standard|bootstrap_builtin
        reference_inputs: []
        derived_from_asset_id: ""
      creation_status: planned|created|stale|missing
      existing_outputs: []

  objects:
    - asset_id: "object_01"
      asset_type: object_reference
      source_script_selectors: ["scene_01_cut_01"]
      story_purpose: ""
      reuse_contract:
        mode: neutral_anchor|time_variant|state_variant
        time_of_day: ""
        derived_from_asset_id: ""
      visual_spec:
        identity: []
        fixed_details: []
        must_avoid: []
      generation_plan:
        output_dir: assets/objects
        required_views: [hero]
        execution_lane: standard|bootstrap_builtin
        reference_inputs: []
        derived_from_asset_id: ""
      creation_status: planned|created|stale|missing
      existing_outputs: []

  locations:
    - asset_id: "location_01"
      asset_type: location_anchor
      source_script_selectors: ["scene_01_cut_01"]
      story_purpose: ""
      reuse_contract:
        mode: neutral_anchor|time_variant|state_variant
        time_of_day: ""
        derived_from_asset_id: ""
      visual_spec:
        identity: []
        fixed_details: []
        must_avoid: []
      generation_plan:
        output_dir: assets/locations
        required_views: [hero]
        execution_lane: standard|bootstrap_builtin
        reference_inputs: []
        derived_from_asset_id: ""
      creation_status: planned|created|stale|missing
      existing_outputs: []

  reusable_stills:
    - asset_id: "still_01"
      asset_type: reusable_still
      source_script_selectors: ["scene_01_cut_01"]
      story_purpose: ""
      visual_spec:
        identity: []
        fixed_details: []
        must_avoid: []
      generation_plan:
        output_dir: assets/scenes
        required_views: [single]
        execution_lane: standard|bootstrap_builtin
        reference_inputs: []
        derived_from_asset_id: ""
      creation_status: planned|created|stale|missing
      existing_outputs: []

asset_plan_validation:
  source_selectors_resolved: false
  asset_ids_unique: false
  reference_paths_valid: false
  variant_lineage_valid: false
  prompts_drawable: false
  request_snapshots_current: false
  outputs_decodable: false
  provenance_matched: false

# Rules:
# - source_script_selectors records usage; generation_plan.reference_inputs records generation inputs.
# - reference_inputs is used only for same-identity/same-location/same-camera derivation.
# - character references normally include full-body front/side/back views.
# - provider is codex_builtin_image (gpt-image-2 via Codex app-server).
# - bootstrap_builtin is the no-reference built-in lane; derived assets use standard.
# - neutral_anchor does not include scene-specific time-of-day light; use an explicit time_variant instead.
# - p550 prompt body uses visible people, places, objects, and actions, never scene/request metadata.

