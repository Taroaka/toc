# Minimal story output template (from docs/story-creation.md)
story_metadata:
  topic: "string"
  # New story artifacts are authored by the Story Architect / Scene Author
  # pipeline and must carry a complete research-grounded scene lifecycle.
  scene_authoring_contract: "story_scene_contract_v1"
  story_author_model: "gpt-6-astra"
  scene_author_model: "gpt-6-astra"
  # 既存物語を映像化する場合のみ、次のコメントを外す。original_story では key 自体を出力しない。
  # adaptation_value_contract: "required_v1"
  # scene time-of-day 新契約の明示マーカー。Historical time の有無で代用しない。
  scene_time_of_day_contract: "required_v1"
  # time_of_day から導いた光源/明るさ/影/色温度の derived contract。
  scene_time_of_day_visual_basis_contract: "required_v1"
  # 物語世界の歴史的時代。古典・既存物語は「〇〇時代」、ユーザー創作は空文字を許容する。
  time: "string"
  source_research: "output/<topic>_<timestamp>/research.md"
  created_at: "ISO8601"
  pattern_used: "hidden_truth|counterintuitive|mystery|hero|emotional"

# ここからは既存物語 adaptation の場合のみ出力する。
# 原作の「何が起きるか」だけでなく、「なぜ観客に価値があるか」を下流まで追跡する正本。
# creative invention や映像手段はここへ書かず、原作価値と変更禁止境界だけを固定する。
adaptation_source_contract:
  schema_version: "adaptation_source_contract_v1"
  mode: "existing_story"
  source_story_promise: "REPLACE_ME: この作品を知る観客から失ってはいけない中心的な約束"
  core_values:
    - value_id: "REPLACE_ME_STABLE_VALUE_ID"
      statement: "REPLACE_ME: 原作で評価されている人間的・感情的・主題的価値"
      audience_effect: "REPLACE_ME: その価値が成立したとき観客に起こす感情・認識"
      source_event_refs:
        - "REPLACE_ME: research/story の根拠 event ID"
  non_negotiable_events:
    - "REPLACE_ME: 圧縮はできても消去・逆転できない出来事"
  non_negotiable_meanings:
    - "REPLACE_ME: 出来事を残しても解釈を歪めてはいけない意味"
  iconic_moments:
    - "REPLACE_ME: 観客が再体験を期待する象徴的瞬間"
  forbidden_value_distortions:
    - "REPLACE_ME: 現代化・スペクタクル化で起こりやすい原作価値の改悪"

outcome_contract:
  goal: "research.md を、後続 stage が迷わず使える story.md に変換する"
  success_criteria:
    - "p100 の story_materials / source_passages / variants / conflicts から scene / beat / emotion curve を作る"
    - "world / conflict / theme と、作品に該当する protagonist / transformation が scene 分解済みである"
    - "primary hook と opening が具体的な事実または強い物語状況を持つ"
    - "各 scene が research refs を持ち、創作補完と事実主張を混同しない"
    - "各 scene が purpose / conflict / turn / affect / visualizable_action / grounding_note を持つ"
    - "最初を除く全 scene が直前の結果を原因として始まる理由を持つ（なぜなら）。時間的な並び（そしてそれから）だけにしない"
    - "各 scene が非空の open string time_of_day を持つ"
    - "各 scene が time_of_day を光源・明るさ・影・色温度へ具体化した visual basis を持つ"
    - "hybridization が必要な場合は明示した user choice が保存されている"
    - "下流で 1 clip = 1意図 に分けられる scene 意図が残っている"
  source_vs_creative_boundary:
    source_backed:
      - "史実"
      - "数値"
      - "固有名詞"
      - "文献差分"
      - "伝承バリエーション"
    creative_allowed:
      - "感情曲線"
      - "視点"
      - "会話"
      - "画作り"
      - "象徴表現"
    ask_before:
      - "research にない事実主張を追加する"
      - "矛盾する複数ソースを同一シーンや設定として混成する"

# Creative selection（必須: 複数案→選択）
#
# 目的:
# - “創造”で多様性を出し、“選択”で source grounding と映像化可能性を確認する。
# - Hero's Journey への当てはめは必須ではない（フレームワークは道具）。
selection:
  candidates:
    - candidate_id: "A"
      logline: "string"
      fact_basis_refs: ["research.engagement.hooks[0]"]
      creative_inventions:
        - element: "string"
          purpose: "dramatic_compression|composite_character|visual_symbol|dialogue"
          does_not_contradict_refs: true
      rationale: ["string"]
      requires_hybridization_approval: false
      conflicts_referenced: ["research.conflicts[C1]"]
    - candidate_id: "B"
      logline: "string"
      fact_basis_refs: ["research.story_baseline.beat_sheet[0]"]
      creative_inventions: []
      rationale: ["string"]
      requires_hybridization_approval: false
      conflicts_referenced: []
  chosen_candidate_id: "A"
  rationale: "string"

# Hybridization approval gate（混成する場合は承認必須・運用）
hybridization:
  approval_status: "not_needed|pending|approved|rejected"
  proposal:
    summary: "string"
    conflicts_referenced: ["research.conflicts[C1]"]
    mix_elements: ["string"]
    risks: ["string"]
    mitigations: ["string"]
    question_for_user: "このハイブリッド（混成）で進めてよいですか？"

ask_before_edit:
  required_when:
    - "mixing incompatible research conflicts"
    - "changing approved protagonist/theme/reveal order"
    - "inventing events presented as factual"
    - "dropping a source-backed beat for pacing"
  question_for_user: "この変更は事実関係または承認済み構成を変えます。進めてよいですか？"

story_structure:
  # 単独主人公を持つ場合の記述例。群像・解説などで不要な主体を追加しない。
  protagonist:
    name: "string"
    role: "string"
    source_node_id: "string"
  # 英雄譚の構成が適する場合に使う。不要な段階は省略でき、成長・帰還を必須にしない。
  journey:
    ordinary_world:
      description: "string"
    ordeal:
      challenge: "string"
    transformation:
      before: "string"
      after: "string"
    return:
      resolution: "string"
  theme:
    # 任意: 作品が扱う問いと観客の理解の始点・終点を、主題と併せて記述できる。
    # docs/story-creation.md「観客の理解と意味の設計」を参照。成長・教訓・解決は必須でない。
    # 人物の journey.transformation と、観客が知ること・解釈することを混同しない。
    governing_thought: "string"

# Architect の scene_plan では causal_connection_from_previous に直前の原因→結果→今の行動を記述（最初は null）。
# Scene Author は冒頭 trigger / start_state / handoff_chain.incoming に反映。根拠のない因果は grounding_note に明示。
story_decomposition:
  source_material_refs: ["research.story_materials.chronological_events[E1]", "research.source_passages[P1]"]
  # 任意: 観客の理解を支える/深める/揺らす出来事と提示順を、既存 scene の責務へ結ぶ。
  # 反復要素や世界観の行動表現を採用する場合だけ、意味の推移と source/scene をここで説明する。
  # 固定段階・反復回数・必須の象徴は設けず、不確かさや変わらないことも保つ。
  beat_strategy: "string"
  emotion_curve_summary: "string"
  notes_on_ignored_or_deferred_material: ["string"]

script:
  scenes:
    - scene_id: 1
      # scene 固有の時間帯。enum ではないため「夜明け前」「真夜中」なども許容する。新規 artifact では非空必須。
      # contract marker がない Legacy の missing/empty だけ、読み込み時に "" として扱い、時間帯 prompt fragment を生成しない。
      time_of_day: "朝"
      # time_of_day から導く derived visual basis。第二の時間帯 authoring root にしない。
      time_of_day_visual_basis: "光源は低い朝の自然光。空や窓外の明るさは穏やかに上がる。影は長く柔らかい。色温度はわずかに暖かい。"
      location:
        location_id: "location_01"
        name: "始まりの部屋"
        mode: "single|sequence"
        sequence: ["始まりの部屋"]
        # mode=sequence では sequence の各場所を一度ずつ覆う。scene概要をcutへ直書きせず、各cutは一つのsegmentだけを使う。
        segments:
          - location: "始まりの部屋"
            responsibility: "この場所で成立させる物語上の出来事"
            primary_subject: "主被写体の人物名"
            visible_action: "一枚で読める具体的な人物行為・状態"
            visible_reaction: "必要な場合だけ、別主体の具体的な反応"
            required_visual_evidence: ["具体的な人物", "具体物"]
            required_roles: ["protagonist"]
            motion_brief: "主被写体が行う一つの観察可能な動作"
            motion_end_state: "誰がどこでどう止まるかを示す物理的終了状態"
      phase: "opening|development|ordeal|transformation|ending"
      purpose: "この scene が物語全体で果たす役割"
      conflict: "この scene 内の内的/外的/構造的な葛藤"
      turn: "この scene で変わる状況・認識・関係"
      affect:
        label_hint: "curiosity|awe|dread|grief|panic|relief|aftertaste"
        audience_job: "hook|bond|strain|release|aftertaste"
      visualizable_action: "画面化できる人物行動・状態変化・象徴の動き"
      grounding_note: "research の confidence / verification / uncertainty を短く判断文に圧縮する"
      narration: "string"
      visual: "string"
      # Mapping back to research for traceability (運用: idが無い場合は短い引用でも可)
      research_refs: ["research.engagement.hooks[0]", "research.story_baseline.beat_sheet[0]"]
      creative_inventions: ["必要時のみ: invented symbol / dialogue / psychology"]
      # Rich authoring source of truth.  The prose volume is variable; IDs,
      # lifecycle, and source coverage determine completeness.
      source_basis:
        event_ids: ["event_01"]
        passage_ids: ["passage_01"]
        fact_ids: []
        character_ids: ["character_01"]
        place_ids: ["place_01"]
        world_rule_ids: []
        symbol_ids: []
        variant_ids: []
        conflict_ids: []
        confidence: 0.9
      scene_intent:
        story_purpose: "このsceneだけが成立させる物語上の責務"
        dramatic_question: "観客がscene全体で追う具体的な問い"
        value_shift:
          from: "開始時の状態"
          to: "終了時の状態"
          visible_evidence: ["変化を画面で確認できる証拠"]
        causal_turn: "次sceneを発生させる不可逆な出来事"
      start_state:
        state_id: "scene_01_start"
        characters: []
        relationships: []
        locations: []
        objects: []
        active_world_rules: []
        # 任意指針の具体化: この時点の観客に開示済みの情報。人物の信念や世界の事実と区別する。
        audience_knowledge: []
      event_sequence:
        - beat_id: "scene_01_beat_01"
          beat_function: "source_event"
          source_event_ids: ["event_01"]
          source_refs: ["passage_01"]
          participants: ["character_01"]
          location_id: "place_01"
          trigger: "このbeatが始まる直接原因"
          what_happens: "誰がどこで何をするか"
          conflict_or_constraint: "行為を妨げる具体的な力"
          required_visual_evidence: ["画面で確認できる人物・物・状態"]
          # 更新だけでなく、理解の補強・維持・疑念も記述できる。毎 beat の反転や新事実は要求しない。
          audience_knowledge_delta: "観客の理解の変化"
          immediate_consequence: "次beatを発生させる結果"
      turning_event:
        beat_id: "scene_01_beat_01"
        irreversible_change: "後戻りできない具体的変化"
      end_state:
        state_id: "scene_01_end"
        characters: []
        relationships: []
        locations: []
        objects: []
        active_world_rules: []
        # 始点からの理解の到達点。未解決の問いは unresolved_threads と reveal_contract に整合させる。
        audience_knowledge: []
        unresolved_threads: []
      reveal_contract:
        state_before: {}
        transitions: []
        state_after: {}
      handoff_chain:
        incoming:
          producer_scene_id: null
          state_id: "scene_01_start"
        outgoing:
          consumer_scene_id: "scene_02"
          state_id: "scene_01_end"
          required_next_scene_start_conditions: []
      preservation:
        must_preserve: ["researchにある出来事・関係・世界規則"]
        must_not_change: ["承認なしの事実改変"]
        must_not_show: ["このsceneではまだ起きていない出来事"]
    - scene_id: 2
      time_of_day: "夜"
      phase: "opening|development|ordeal|transformation|ending"
      purpose: "string"
      conflict: "string"
      turn: "string"
      affect:
        label_hint: "string"
        audience_job: "string"
      visualizable_action: "string"
      grounding_note: "string"
      narration: "string"
      visual: "string"
      research_refs: []

engagement_design:
  primary_hook:
    type: "string"
    content: "string"
    position_percent: 0

authoring_checks:
  source_refs_present: true
  scene_ids_unique: true
  event_order_valid: true
  scene_handoffs_valid: true
  success_criteria:
    viewer_takeaway: "string"
    must_remember: ["string"]
    must_not_misunderstand: ["string"]
  scope_boundaries:
    factual_claims_locked: true
    creative_license_declared: true
