# source_first_v2: see docs/implementation/visual-planning.md.
# Legacy scene_value_amplification / expressive_contract samples below apply only to v1.
# v2 uses metadata visual_planning_contract and source_visual_value {path, sha256},
# plus source_story_scene_id and scene_intent.visual_notes (empty allowed).
# Cut Blueprint Template v3.0
# p420 authoring → structural validation → p450 manifest materialization

cut_blueprint_version: "3.0"
legacy_compatibility:
  copy_to_scene_contract: false
  copy_legacy_cut_blueprint_fields: true
  note: "cut_contract.source_event_contract is canonical; scene_contract is a read-only legacy alias"

source_scene:
  scene_id: "1"
  selector: "scene1"
  scene_intent_snapshot:
    story_purpose: ""
    dramatic_question: ""
    scene_spine: ""
    value_shift:
      from: ""
      to: ""
      visible_evidence: []
    causal_turn: ""
    audience_information: []
    withheld_information: []
    reveal_constraints: []
    visual_thesis: ""
    handoff_to_next_scene: ""
    story_event_obligations: []
    role_coverage:
      required_roles: []
    audience_knowledge_plan:
      before_scene: []
      learned_during_scene: []
      still_unknown_after_scene: []
    visual_proof_obligations: []
    anti_redundancy_policy: "同じ story fact を証明する cut はまとめる"
    static_first_frame_rules:
      - "motion を説明せず、開始状態の証拠を静止画で示す"
  scene_event_snapshot:
    schema_version: "scene_event_v1"
    event_logline: ""
    start_situation: ""
    source_story_beat_ids: []
    event_sequence:
      - beat_id: "scene1_event_01"
        beat_function: custom
        source_story_beat_ids: []
        what_happens: ""
        visible_action: ""
        visible_reaction: ""
        immediate_consequence: ""
        required_visual_evidence: []
    turning_event:
      source_event_beat_id: "scene1_event_01"
      causal_turn_ref: "scene_intent.causal_turn"
    end_situation:
      value_shift_to_ref: "scene_intent.value_shift.to"
      visible_evidence_refs: []
    forbidden_event_changes: []

scene_cut_coverage_plan:
  coverage_strategy: "reverse_from_scene_event"
  source_schema_version: "scene_event_v1"
  event_beat_inventory:
    - beat_id: "scene1_event_01"
      beat_function: custom
      must_be_seen: true
      assigned_cut_ids: ["scene1_cut1"]
  scene_obligations:
    - obligation_id: "scene1_obligation_01"
      source: causal_turn
      evidence: "不可逆 turn の可視証拠"
      assigned_cut_ids: ["scene1_cut1"]
  cut_assignments:
    - cut_selector: "scene1_cut1"
      obligation_ids: ["scene1_obligation_01"]
      event_assignment:
        source_event_contract:
          primary_event_beat_id: "scene1_event_01"
          source_event_beat_ids: ["scene1_event_01"]
      target_beat: "可視の turn"

cuts:
  - cut_id: "scene1_cut1"
    selector: "scene1_cut1"
    cut_status: active|deleted
    deletion_reason: ""
    cut_contract:
      schema_version: "3.0"
      expressive_contract:
        schema_version: cut_expressive_contract_v1
        source_value_refs: []
        scene_amplification_ref: scene1.scene_intent.scene_value_amplification
        audience_experience_delta: ''
        expressive_function: recognition|withhold|pressure|release|contrast|reaction|reframe|afterimage|spectacle|transition
        performance_beat: ''
        visual_pressure: ''
        attention_shift: ''
        edit_trigger: ''
        sound_function: ''
        emotional_afterimage: ''
        must_not_reduce_to: []
      source_event_contract:
        primary_event_beat_id: "scene1_event_01"
        source_event_beat_ids: ["scene1_event_01"]
        event_beat_function: custom
        event_time_position: before_trigger
        source_visible_action: ""
        source_visible_reaction: ""
        source_required_visual_evidence: []
        event_facts_to_preserve: []
        event_facts_not_to_invent: []
        allowed_reveal_info_ids: []
        forbidden_reveal_info_ids: []
      cut_role: main
      cut_function: custom
      intent_budget:
        primary_intent: ""
        secondary_intents_allowed: []
        assigned_obligation_ids: ["scene1_obligation_01"]
      duration_intent: standard
      target_duration_seconds: 8
      duration_exception:
        allowed: false
        reason: ""
      viewer_contract:
        target_beat: ""
        screen_question: ""
        dramatic_job: ""
        audience_knowledge_delta: ""
        causal_proof: ""
        visual_evidence: []
        required_roles: []
        anti_redundancy_key: ""
        must_show: []
        must_avoid: []
        done_when: []
      cinematic_contract:
        pov: third_person|subjective_pov|over_the_shoulder|insert|establishing
        shot_size: wide|medium|closeup|extreme_closeup|insert
        camera_angle: eye_level|low_angle|high_angle|overhead|tracking
        camera_intent: ""
        subject_priority: {primary: "", secondary: "", background: ""}
        screen_geography: {foreground: "", midground: "", background: "", screen_direction: ""}
        lighting_intent: ""
      continuity_contract:
        location_ids: []
        location_variant_ids: []
        character_ids: []
        character_variant_ids: []
        object_ids: []
        object_variant_ids: []
        start_state: {character_state: "", prop_state: "", spatial_state: "", time_state: ""}
        end_state: {character_state: "", prop_state: "", spatial_state: "", time_state: ""}
        carry_forward_to_next_cut: []
        continuity_risks: []
      cut_handoff:
        receives_from_previous: {anchor_id: "", anchor_type: none, visible_or_audible_form: "", expected_previous_cut_selector: ""}
        delivers_to_next: {anchor_id: "", anchor_type: terminal, visible_or_audible_form: "", expected_next_cut_selector: ""}
      first_frame_contract:
        imageable: true
        image_role: video_first_frame_candidate
        source_event_beat_id: scene1_event_01
        event_time_position: before_trigger
        event_fact_visible_in_still: ""
        not_yet_happened_in_still: []
        first_frame_brief: ""
        visible_start_state: {character_state: "", prop_state: "", spatial_state: "", emotional_state: "", gaze_or_attention: ""}
        motion_start_affordance: {movable_subject: "", movement_vector: "", camera_start_reason: ""}
        action_completion_state: pre_action|early_action|mid_action|aftermath|hold
        static_first_frame_rule: ""
        must_be_static_evidence_not_motion: true
        must_include: []
        must_avoid: []
      motion_contract:
        movable: true
        source_event_beat_id: scene1_event_01
        starts_from_first_frame: true
        must_not_advance_to_event_beat_ids: []
        motion_brief: ""
        camera_motion: ""
        subject_motion: ""
        environment_motion: ""
        emotional_change: ""
        start_from_visible_state: ""
        end_state: ""
        end_frame_brief: ""
        must_not_add: []
      narration_contract:
        schema_version: narration_contract_v2
        speakable_or_silent: true
        source_event_beat_ids: ["scene1_event_01"]
        allowed_info_ids: []
        forbidden_info_ids: []
        must_not_advance_to_event_beat_ids: []
        must_not_explain_visible_action_as_caption: true
        narration_event_boundary: same_event_only
        story_role:
          narrative_position: opening|middle|ending
          cut_function: custom
          voice_function: information|emotion|causality|time|viewpoint|world_rule|contrast|meaning|aftertaste|silence
          audience_state_before: ""
          audience_state_after: ""
          must_cover: []
          must_not_reveal: []
        visual_distance:
          distance_policy: stay_close|contextual|meaning_first|silent
          visible_facts_in_frame: []
          narration_should_add: []
          must_not_caption_visible_action: true
        rhythm_and_timing: {target_speech_seconds: 0, start_timing: immediate, end_timing: on_cut_end, pause_intent: []}
        tts_readiness: {normalization_policy: kanji_public_hiragana_tts, pronunciation_targets: [], max_sentence_chars: 42}
      downstream_handoff:
        p500_asset: []
        p600_image: []
        p700_narration: []
        p800_video: []
        carries_to_next_cut: []
        carries_to_next_scene: []
    scene_contract_alias:
      target_beat: cut_contract.viewer_contract.target_beat
      source_event_contract: cut_contract.source_event_contract
      first_frame_brief: cut_contract.first_frame_contract.first_frame_brief
      motion_brief: cut_contract.motion_contract.motion_brief
      must_show: cut_contract.viewer_contract.must_show
      must_avoid: cut_contract.viewer_contract.must_avoid

cut_blueprint_validation:
  source_refs_resolved: false
  ids_unique: false
  event_inventory_ordered: false
  one_intent_per_cut: false
  first_frame_imageable: false
  motion_boundary_valid: false
  narration_boundary_valid: false
  handoff_valid: false

