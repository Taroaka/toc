# New-run planning. Replace source scene IDs; metadata bindings are set by the runtime.
# See docs/implementation/visual-planning.md. Examples are structure only.
visual_value_metadata:
  visual_planning_contract: source_first_v2
  # New author output is checked and this marker is bound by runtime.
  b_roll_policy: boundary_b_roll_v1
  source_bindings:
    research: {path: research.md, sha256: "sha256:REPLACE_ME_RUNTIME_HASH"}
    story: {path: story.md, sha256: "sha256:REPLACE_ME_RUNTIME_HASH"}

# One row per source scene, in its exact order. Empty notes are valid authored decisions.
scene_visual_values:
  - scene_selector: REPLACE_ME_EXACT_SOURCE_SCENE_ID
    notes: []
    boundary_b_roll:
      reason: "REPLACE_ME_接続判断。原則1件、0件にする場合は直接接続の理由"
      cuts: []
      # Each authored cut requires: technique, source_event_beat_id (final existing beat),
      # location (scene end), subject, first_frame, motion, end_state, foreground, background, light.
      # See docs/implementation/b-roll-design.md. No runtime cut IDs or invented events.

# Optional work-specific choices; no default palette or emotional arc.
global_visual_identity:
  notes: []

# Optional entries: source_refs [{source: story|research, pointer: /...}],
# scene_selectors [existing source IDs], note (concrete continuity decision).
continuity_notes: []
