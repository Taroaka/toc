# Minimal research output template (from docs/information-gathering.md)
# コピーしないこと：テンプレートの例文・物語内容・出典・信頼度を成果物へ流用しない。
# 利用するのは項目と構造のみ。内容は対象の原作・調査結果に基づいて作ること。
#
# NOTE:
# - これはMVP向けの最小スキーマ。
# - p100 は scene 分割ではなく、p200 が物語化できる素材を厚く残す。
# - 情報量を最大化したい場合は `workflow/research-template.production.yaml` を推奨。
topic: "string"
aliases: ["string"]

# Story materials（必須）
story_materials:
  canonical_story_dump: "string" # 調査した筋を厚く書く。複数版は variant_id を明示して分け、未選択の版を統合しない。
  chronological_events:
    - event_id: "E1"
      event: "string"            # scene ではなく出来事単位。
      sources: ["S1"]
      variant_ids: ["V1"]       # この出来事を確認した版。空配列は所属未確認であり、全版共通を意味しない。
      evidence_kind: "explicit_text|source_inference|external_interpretation"
      evidence_refs: ["P1"]
      confidence: 0.0
  # 資料で裏付けられる因果だけ。隣接する全出来事をつなぐ必要はない。
  causal_links: []
  # - link_id: "CL1"
  #   cause_event_id: "E1"
  #   effect_event_id: "E2"      # 実在する別の event_id
  #   explanation: "string"
  #   variant_ids: ["V1"]
  #   evidence_kind: "explicit_text|source_inference|external_interpretation"
  #   sources: ["S1"]
  #   evidence_refs: ["P1"]
  #   basis: "string"          # この資料が因果を支える理由。推論・外部解釈はその旨を明記。
  characters:
    - character_id: "C1"
      name: "string"
      role: "string"
      motivations: ["string"]
      relationships:
        - target: "C2"
          relation: "string"
  setting:
    places: ["string"]
    time_or_era: "string"
    world_rules: ["string"]
  symbols_and_themes:
    - item_id: "SYM1"
      # 具体的な物体のみ object。主題や質感を小道具へ変換しない。
      kind: "object|theme|motif"
      item: "string"
      meaning: "string"
      evidence_refs: ["P1"]
  emotional_material:
    - emotion: "string"
      trigger: "string"
      story_value: "string"
  adaptation_options:
    - option_id: "A1"
      evidence_kind: "creative_proposal" # 任意案。採用・構成・演出の設計は p200 が担当。
      proposal: "string"
      source_basis: ["S1"]
      risks: ["string"]

# Sources（必須）
source_inventory:
  - source_id: "S1"
    title: "string"
    url: "string"
    type: "primary|academic|encyclopedia|news|blog|video|other"
    reliability: "high|medium|low"
    accessed_at: "ISO8601"
    notes: "string"

source_passages:
  - passage_id: "P1"
    source_id: "S1"
    passage: "string"            # 短い抜粋または要約。長文引用しない。
    evidence_note: "string"
    confidence: 0.0

# Variants / conflicts（必須）
variants:
  - variant_id: "V1"
    name: "string"
    story_dump: "string"       # この版単独の筋。単一版でも版・底本を識別する。
    event_ids: ["E1"]
    familiarity:
      audience: "string" # 依頼言語・対象地域など
      basis: "string" # 普及・受容の根拠。古さや資料数だけで判定しない。
      source_refs: []
      uncertainty: "string" # 未確認なら未確認と記す。数値を捏造しない。
    differences: ["string"]
    impact_on_story: "string"
    sources: ["S1"]

conflicts:
  - conflict_id: "C1"
    topic: "string"
    accounts:
      - account_id: "A"
        claim: "string"
        sources: ["S1"]
        confidence: 0.0
      - account_id: "B"
        claim: "string"
        sources: ["S2"]
        confidence: 0.0
    impact_on_story: "string"
    selection_notes:
      recommended_choice: "A|B|both_separated|hybrid_requires_approval"
      rationale: "string"
    hybrid_proposal:
      proposed: false
      mix_elements: ["string"]
      risks: ["string"]
      mitigations: ["string"]

facts:
  items:
    - fact_id: "F1"
      claim: "string"
      kind: "plot|character|setting|theme|symbol|historical_context|interpretation|other"
      material_path: "/story_materials/chronological_events/0/event" # 対象記述への JSON Pointer。関連箇所がなければ空文字。
      variant_ids: ["V1"]
      evidence_kind: "explicit_text|source_inference|external_interpretation"
      evidence_refs: ["P1"]
      confidence: 0.0
      verification: "verified|partially_verified|unverified"
      sources: ["S1"]
      notes: "string"

engagement:
  hooks:
    - hook_id: "H1"
      type: "mystery|counterintuitive|hidden_truth|emotional|connection|controversy"
      content: "string"
      curiosity_score: 0.0
      supporting_facts: ["F1"]

open_questions:
  - question_id: "Q1"
    question: "string"
    known_theories: ["string"]
    investigation_status: "unverified|in_progress|verified"
    resolution_need: "research_required|p200_decision|non_blocking"
    sources: ["S1"]

handoff_to_story:
  recommended_focus: ["string"]
  must_preserve: ["string"]
  avoid_overstating: ["string"]
  selection_questions_for_p200: ["string"]

# Optional only: p200 を拘束しない粗い使い所メモ。
suggested_story_usage:
  - material_ref: "F1|H1|P1|E1"
    suggested_position: "opening|development|midpoint|climax|ending|any"
    rationale: "string"

metadata:
  collected_at: "ISO8601"
  sources_used: ["S1"]
  confidence_score: 0.0

evaluation_contract:
  target_questions: ["string"]
  must_cover: ["canonical_story_dump", "chronological_events", "source_passages", "conflicts"]
  must_resolve_conflicts: ["string"]
  done_when: ["原作の筋・資料が支える因果・版別の根拠を追え、調査上の不足と p200 の選択事項を区別できる"]
