contract_version: 11

global_required_docs:
  - docs/system-architecture.md

aliases:
  manifest: manifest
  image_prompt: scene_implementation
  video: video_generation

stages:
  research:
    required_docs:
      - docs/information-gathering.md
    required_templates:
      - workflow/research-template.yaml
      - workflow/research-template.production.yaml
    required_inputs: []
    optional_playbooks:
      - workflow/playbooks/research/deep-primary-first.md

  story:
    required_docs:
      - docs/story-creation.md
      - docs/adaptation-value-amplification.md
    required_templates:
      - workflow/story-template.yaml
    required_inputs:
      - research.md
    optional_playbooks: []

  visual_value:
    # p300 visual planning grounding entry. This tracks visual_value.md
    # authoring; it is not a canonical generation stage.
    required_docs:
      - docs/implementation/b-roll-design.md
      - docs/story-creation.md
      - docs/data-contracts.md
      - docs/adaptation-value-amplification.md
      - docs/implementation/visual-planning.md
    required_templates:
      - workflow/visual-value-template.yaml
    required_inputs:
      - research.md
      - story.md
    optional_playbooks: []

  script:
    optional_inputs:
      - narration_style.json
      - visual_value.md
      - cinematic_preferences.md
    required_docs:
      - docs/implementation/narration-prompting.md
      - docs/implementation/p400-cinematic-authoring.md
      - workflow/playbooks/sound-design/affect-and-spotting.md
      - docs/implementation/cinematic-language.md
      - docs/implementation/b-roll-design.md
      - docs/story-creation.md
      - docs/script-creation.md
      - docs/implementation/scene-loop.md
      - docs/implementation/agent-roles-and-prompts.md
      - docs/data-contracts.md
      - docs/adaptation-value-amplification.md
    required_templates:
      - workflow/script-template.yaml
      - workflow/scene-outline-template.yaml
      - workflow/video-manifest-template.md
    required_inputs:
      - story.md
    optional_playbooks:
      - workflow/playbooks/script/hero-journey-beat-first.md
      - workflow/playbooks/script/hero-journey-cinematic-setpieces.md
      - workflow/playbooks/script/visual-value-midroll-pass.md

  narration:
    optional_inputs:
      - narration_style.json
      - cinematic_direction.json
      - visual_value.md
    required_docs:
      - docs/implementation/narration-prompting.md
      - docs/implementation/b-roll-design.md
      - docs/implementation/video-integration.md
    required_templates:
      - workflow/video-manifest-template.md
    required_inputs:
      - script.md
      - video_manifest.md
    optional_playbooks: []
    required_manifest_phase:
      path: video_manifest.md
      allowed_values:
        - production

  asset:
    optional_inputs:
      - cinematic_direction.json
      - visual_value.md
    required_docs:
      - docs/implementation/asset-bibles.md
      - docs/data-contracts.md
    required_templates:
      - workflow/asset-inventory-template.yaml
      - workflow/asset-plan-template.yaml
    required_inputs:
      - story.md
      - script.md
      - video_manifest.md
    optional_playbooks: []

  manifest:
    optional_inputs:
      - cinematic_direction.json
    # p450 skeleton manifest grounding. This is part of p400 authoring,
    # so it only requires the manifest and script inputs.
    required_docs:
      - docs/implementation/b-roll-design.md
      - docs/script-creation.md
      - docs/implementation/agent-roles-and-prompts.md
      - docs/data-contracts.md
      - docs/adaptation-value-amplification.md
    required_templates:
      - workflow/video-manifest-template.md
    required_inputs:
      - video_manifest.md
      - script.md
    optional_playbooks: []

  scene_implementation:
    optional_inputs:
      - cinematic_direction.json
      - visual_value.md
    required_docs:
      - docs/implementation/b-roll-design.md
      - docs/implementation/image-prompting.md
      - docs/implementation/asset-bibles.md
      - docs/implementation/agent-roles-and-prompts.md
      - docs/data-contracts.md
      - docs/adaptation-value-amplification.md
    required_templates:
      - workflow/scene-outline-template.yaml
      - workflow/video-manifest-template.md
    required_inputs:
      - video_manifest.md
      - script.md
    optional_playbooks:
      - workflow/playbooks/image-generation/reference-consistent-batch.md

  video_generation:
    optional_inputs:
      - cinematic_direction.json
      - visual_value.md
    required_docs:
      - docs/implementation/b-roll-design.md
      - docs/video-generation.md
      - docs/implementation/video-prompting.md
      - docs/adaptation-value-amplification.md
      # The grounding contract has no provider-conditional required-playbook selector.
      # Treat the Kling execution playbook as an unconditional stage document
      # so every Kling request is present in the verified grounding readset.
      - workflow/playbooks/video-generation/kling.md
    required_templates:
      - workflow/video-manifest-template.md
    required_inputs:
      - video_manifest.md
    optional_playbooks:
      - workflow/playbooks/video-generation/first-last-frame-chained.md
      - workflow/playbooks/scene-production/first-last-frame-continuity.md
    required_manifest_phase:
      path: video_manifest.md
      allowed_values:
        - production

  sound_design:
    required_docs:
      - docs/implementation/sound-design.md
      - docs/implementation/video-integration.md
      - docs/research/film-sound-emotion.md
      - workflow/playbooks/sound-design/affect-and-spotting.md
    required_templates:
      - workflow/sound-spotting-template.md
    required_inputs:
      - video_manifest.md
    optional_inputs:
      - script.md
      - sound_design.json
    optional_playbooks: []
