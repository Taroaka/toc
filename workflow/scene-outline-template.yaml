# Scene Outline / Cinematic Scene Contract Template

# scene.md は story と generation prompt の間の authoring artifact。
# p400 では provider を呼ばず、p410/p420 の普通の構造検証後に p450 へ渡す。
scene_outline_metadata:
  topic: "<topic>"
  scene_time_of_day_contract: "required_v1"
  source_research: "output/<topic>_<timestamp>/research.md"
  source_story: "output/<topic>_<timestamp>/story.md"
  source_visual_value: "output/<topic>_<timestamp>/visual_value.md"
  created_at: "<ISO8601>"
  method_used: "cinematic_scene_contract"
  version: 3
  scene_count: 0

scene_design_rules:
  scene_count_strategy: "maximal_meaningful"
  scene_count_goal: "source story の主要 beat を落とさず、独立した責務を持つ scene を作る"
  scene_count_stop_condition: "独立した dramatic_question / value_shift / causal_turn がなく、既存 cut を厚くする方が適切な状態"
  scene_specificity_required_layers:
    - non_compressible_beat_inventory
    - scene_promotion_rule
    - unique_scene_responsibility
    - actor_force_coverage
    - object_meaning_ladder
    - concrete_handoff_chain
    - anti_template_language
    - concrete_event
    - story_grounding
    - non_replaceable_elements
    - asset_story_function_usage
  canonical_event_coverage_matrix_required: true
  abstract_language_policy: "abstract function だけで終わらず、source-grounded concrete event を持つ"
  banned_generic_scene_phrases:
    - "主人公は前進できるか"
    - "次へ進む理由が生まれる"
    - "光が次の場面へ運ぶ"
    - "価値変化の兆し"
    - "場所の圧力"
    - "主人公の姿勢と視線"
  p400_does_not_write_final_prompt: true
  scene_must_have_value_shift: true
  scene_must_have_causal_turn: true
  cut_must_have_single_intent: true
  prompt_language: "ja"
  no_on_screen_text: true
  image_policy: "continuity anchor が必要な cut に still を作り、既存 anchor は再利用する"

global_constraints:
  aspect_ratio: "16:9"
  visual_style: "実写映画調、自然な映画照明、実物セット感"
  global_must_include:
    - "前景/中景/背景の空間設計"
    - "観客が最初に読む主被写体"
  global_must_avoid:
    - "画面内テキスト"
    - "字幕"
    - "ウォーターマーク"
    - "ロゴ"
    - "アニメ/漫画/イラスト調"
  references:
    character_images: []
    style_images: []
    object_images: []
    location_images: []
    notes: "reference path は metadata に保持し、prompt 本文には書かない"

story_truth:
  theme: "<story theme>"
  protagonist: "<protagonist>"
  reveal_order_summary: "<reveal order>"
  source_references: []
  forbidden_changes:
    - "story.md の事実関係、reveal順序、主人公、themeを無断変更しない"

story_beat_coverage_matrix:
  - beat_id: "story_beat_01"
    source_story_selector: "story.beats[0]"
    beat_summary: ""
    irreversible: true
    assigned_scene_ids: []
    promotion_decision: "scene|cut|narration|omitted"
    promotion_reason: ""
    reveal_timing: "before|during|after"
    emotional_function: "hook|pressure|turn|payoff|aftertaste"
    visual_evidence_required: []
    risk_if_compressed: ""

canonical_event_coverage_matrix:
  policy_version: canonical_event_coverage_matrix_v1
  source: [research, story, user_input, asset_bible]
  source_story_events:
    - source_event_id: ""
      source_event_summary: ""
      importance: low|medium|high|critical
      required: true
      must_appear_as: scene|cut|narration|visual_motif|can_be_omitted
      canonical_order_index: 0
      assigned_scene_ids: []
      assigned_event_beat_ids: []
      omission_reason: ""
      adaptation_change_reason: ""
      explicit_source_choice: false

scene_set_authoring_contract_ref:
  schema_version: scene_set_authoring_contract_ref_v1
  path: script.md#/scene_set_authoring_contract
  generation_id: scene-authoring-<id>
  contract_digest: sha256:<hex>
  source_digest: sha256:<hex>

scene_decision_log:
  - decision_id: scene_decision_001
    action: add_scene|merge_scene|split_scene|delete_scene|reorder_scene
    target_scene_ids: []
    source_story_beat_ids: []
    reason: ""
    impact_on_reveal_order: ""
    impact_on_duration: ""

scenes:
  - scene_id: 1
    scene_contract_slice:
      schema_version: scene_contract_slice_v1
      scene_id: 1
      generation_id: scene-authoring-<id>
      contract_digest: sha256:<hex>
      scene_slice_digest: sha256:<hex>
      canonical_event_ids: []
      required_beat_specs: []
      role_bindings: []
      reveal_state_before: {}
      allowed_reveal_transition_ids: []
      reveal_state_after: {}
      time_location_transition:
        time_of_day: ""
        continuity_from_previous: opening
        transition_cue_required: false
        transition_cue_ids: []
        location_sequence: []
      incoming_handoff_anchor_id: story_opening
      outgoing_handoff_anchor_id: handoff_1_2
      causal_proof_contract:
        cause_beat_id: scene1_beat_01
        action_beat_id: scene1_beat_01
        result_state_id: state_after_scene1
        required_evidence_ids: []
      non_replaceable_elements: []
    authoring_preflight:
      schema_version: scene_authoring_preflight_v1
      status: pending|passed|failed
      generation_id: scene-authoring-<id>
      contract_digest: sha256:<hex>
      scene_slice_digest: sha256:<hex>
      source_digest: sha256:<hex>
      preflight_digest: sha256:<hex>
      checks: []
      blocking_reason_keys: []
    time_of_day: "朝"
    time_of_day_visual_basis: "光源、空の明るさ、影、色温度"
    location_mode: single|sequence
    location_sequence: ["始まりの場所"]
    location_segments:
      - location: "始まりの場所"
        responsibility: "この場所で成立させる出来事"
        primary_subject: "主被写体"
        visible_action: "一枚で読める状態"
        visible_reaction: ""
        required_visual_evidence: []
        required_roles: [protagonist]
        visible_character_state:
          posture: ""
          gaze: ""
          expression: ""
          hands: ""
          feet: ""
        motion_brief: "一つの観察可能な動作"
        motion_end_state: "物理的終了状態"
    scene_name: "<短いscene名>"
    importance: low|medium|high|critical
    target_duration_seconds: 24
    estimated_duration_seconds: 24
    phase: opening|development|ordeal|transformation|ending
    scene_intent:
      story_purpose: "scene が担う責務"
      dramatic_question: "観客が追う問い"
      scene_spine: "固有の event progression"
      value_shift:
