      causal_turn: "次 scene を発生させる不可逆変化"
      audience_information: []
      withheld_information: []
      reveal_constraints: []
      affect_transition: ""
      character_state:
        start: ""
        end: ""
        visible_behavior: []
      visual_thesis: "描画可能な一枚の意味"
      handoff_to_next_scene: "次 scene へ渡す anchor"
      scene_conflict_engine:
        desire: ""
        obstacle: ""
        stakes: ""
        escalation: ""
        no_return_point: ""
        visible_pressure: []
      audience_knowledge_delta:
        before_scene: []
        learned_during_scene: []
        still_unknown_after_scene: []
        forbidden_early_reveals: []
      handoff_chain:
        incoming: {anchor_id: "", anchor_type: "object|sound|gaze|gesture|threat|question|none", visible_or_audible_form: ""}
        outgoing: {anchor_id: "", anchor_type: "object|sound|gaze|gesture|threat|question|terminal", next_scene_selector: ""}
      story_specificity:
        non_compressible_beat: ""
        scene_promotion_reason: ""
        unique_scene_responsibility: ""
        actor_forces: {protagonist: "", opposing: [], helping: [], observing: [], pressure_method: ""}
        meaning_ladder: {protagonist_stage: "", relationship_stage: "", object_or_setpiece_stage: ""}
        concrete_handoff: {incoming_trigger: "", outgoing_anchor: "", outgoing_pressure: ""}
        anti_template_language: {story_specific_terms: [], specificity_note: ""}
    scene_event:
      schema_version: scene_event_v1
      event_logline: ""
      start_situation: ""
      source_story_beat_ids: []
      event_sequence:
        - beat_id: scene1_beat_01
          beat_function: custom
          source_story_beat_ids: []
          concrete_event:
            who: []
            where: ""
            what_happens: ""
            conflict_or_constraint: ""
            visible_action: ""
            visible_reaction: ""
            immediate_consequence: ""
            required_visual_evidence: []
          story_grounding:
            source_origin: user_input|script|canonical_reference|asset_bible|inferred|adaptation_choice|invented_candidate
            source_story_beat_ids: []
            source_confidence: high|medium|low
            source_text_or_summary: ""
            non_replaceable_elements: []
            concrete_story_elements: []
            asset_story_function_usage: []
          what_happens: ""
          visible_action: ""
          visible_reaction: ""
          immediate_consequence: ""
          emotional_pressure: ""
          required_visual_evidence: []
          story_information_revealed_ids: []
      turning_event:
